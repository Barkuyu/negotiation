['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,s)});

document.addEventListener('dblclick',p,s);
addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},s);

<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

</head><body>
<title>面談練習室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* 版面概念：單欄工具。頂部極簡導覽，設定表單 → 對話 → 像面試評分表一樣的回饋頁。 */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --surface2:#E6ECF0; --line:#C9D3DB;
  --fg:#15202B; --fg2:#4D5C69;
  --accent:#1F4E79; --on-accent:#FFFFFF; --accent-soft:#DCE8F3;
  --signal:#8F5307; --signal-soft:#FBF0DC; --bad:#B3261E;
  --f-sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC',system-ui,sans-serif;
  --f-serif:'Noto Serif TC','Songti TC','PMingLiU','Source Han Serif TC',serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151C; --surface:#16212B; --surface2:#1E2B37; --line:#2C3B49;
    --fg:#E4ECF2; --fg2:#9BADBC;
    --accent:#86B8EA; --on-accent:#0B1823; --accent-soft:#1B3045;
    --signal:#E3A655; --signal-soft:#2A2113; --bad:#F0897F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#16212B; --surface2:#1E2B37; --line:#2C3B49;
  --fg:#E4ECF2; --fg2:#9BADBC;
  --accent:#86B8EA; --on-accent:#0B1823; --accent-soft:#1B3045;
  --signal:#E3A655; --signal-soft:#2A2113; --bad:#F0897F;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg);
  font:15px/1.7 var(--f-sans);
  padding-block:10px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
h1,h2{font-family:var(--f-serif);text-wrap:balance;margin:0}
h1{font-size:26px;line-height:1.35;font-weight:700}
h2{font-size:18px;line-height:1.4;font-weight:700;margin-bottom:10px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 頂部 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 22px}
.brand{display:flex;flex-direction:column;line-height:1.2}
.mark{font-family:var(--f-serif);font-weight:700;font-size:20px;letter-spacing:.04em}
.sub{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg2)}
.seg{display:inline-flex;background:var(--surface2);padding:3px;gap:2px;border-radius:11px;max-width:100%}
.seg label{position:relative;display:block}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg label span,.tabs button{display:block;padding:7px 16px;border-radius:8px;font-weight:600;color:var(--fg2);white-space:nowrap}
.seg input:checked + span,.tabs button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 0 0 1px var(--line)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.tabs button{border:0;background:transparent;cursor:pointer}

/* 表單 */
.lead{color:var(--fg2);max-width:58ch;margin-top:8px}
form{display:grid;gap:18px;margin-top:22px}
.fields{display:grid;gap:16px}
.field{display:grid;gap:6px;min-width:0}
.row2{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:600px){.row2{grid-template-columns:1fr 1fr}}
.lbl{font-size:13.5px;font-weight:700}
.lbl small{font-weight:400;color:var(--fg2)}
input[type=text],select,textarea{
  width:100%;min-width:0;padding:10px 12px;font-size:16px;line-height:1.5;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
}
textarea{resize:vertical}
.hint-txt{font-size:13px;color:var(--fg2);min-height:1.4em}
.note{font-size:13px;color:var(--fg2);max-width:60ch}
.banner{margin-top:16px;padding:10px 14px;border-radius:10px;background:var(--signal-soft);border:1px solid var(--signal);color:var(--fg);font-size:14px}
.err{color:var(--bad);font-size:14px;font-weight:500}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;line-height:1.3}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.stop{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;margin-bottom:14px}

/* 對話 */
.sessionbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sb-left{min-width:0}
.sb-title{font-family:var(--f-serif);font-weight:700;font-size:16px;overflow-wrap:anywhere}
.sb-meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--fg2);min-height:1.6em}
.prog{display:inline-block;width:72px;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.sb-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.timer{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;color:var(--fg2)}
.log{display:flex;flex-direction:column;gap:16px;padding-block:18px;min-height:42vh}
.msg{display:flex;flex-direction:column;gap:4px;max-width:90%;min-width:0}
.msg.me{align-self:flex-end;align-items:flex-end}
.who{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--fg2)}
.bubble{padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.me .bubble{background:var(--accent);border-color:var(--accent);color:var(--on-accent);border-radius:14px 14px 4px 14px}
.hintnote{align-self:stretch;max-width:100%;padding:10px 14px;border:1px dashed var(--signal);background:var(--signal-soft);border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.hintnote .who{color:var(--signal);display:block;margin-bottom:2px;font-weight:500}
.endcard{align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px}
.retry{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;border:1px solid var(--bad);border-radius:10px;color:var(--fg);font-size:14px;margin-bottom:12px}
.dots{display:inline-flex;gap:4px;align-items:center;height:1.4em}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--fg2);animation:blink 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}}
.composer{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.composer textarea{field-sizing:content;min-height:3.4em;max-height:38vh}
.comp-actions{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.kbd{font-size:12px;color:var(--fg2)}
@media (hover:none){.kbd{display:none}}
.comp-right{display:flex;align-items:center;gap:12px}

/* 回饋 */
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;color:var(--fg2);margin-bottom:6px}
.meta{font-size:13px;color:var(--fg2);margin-top:6px}
.scorehead{display:flex;align-items:baseline;gap:10px;margin-top:22px}
.scorehead .n{font-family:var(--f-mono);font-size:56px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums;color:var(--accent)}
.scorehead .of{font-family:var(--f-mono);font-size:20px;color:var(--fg2)}
.scorehead .cap{font-size:13px;color:var(--fg2);margin-left:6px}
.summary{margin-top:12px;max-width:62ch}
.result{margin-top:10px;max-width:62ch}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
section.blk{margin-top:28px}
.sheet{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 16px 4px}
.crit{padding:12px 0;border-top:1px solid var(--line)}
.crit:first-of-type{border-top:0;padding-top:4px}
.crit-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.crit-name{font-weight:700}
.crit-desc{font-size:12.5px;color:var(--fg2)}
.boxes{display:inline-flex;align-items:center;gap:4px;flex-shrink:0}
.boxes i{display:block;width:20px;height:11px;border:1px solid var(--line);border-radius:2px;background:var(--surface2)}
.boxes i.on{background:var(--accent);border-color:var(--accent)}
.boxes .num{font-family:var(--f-mono);font-size:12.5px;margin-left:6px;color:var(--fg2);font-variant-numeric:tabular-nums}
.crit-note{margin-top:6px;font-size:14px;max-width:62ch}
ul.plain{margin:0;padding-left:1.2em;display:grid;gap:6px;max-width:62ch}
.rw{display:grid;gap:6px;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:10px;margin-bottom:10px}
.rw-row{display:grid;grid-template-columns:4.5em 1fr;gap:10px;align-items:baseline}
.rw-k{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;color:var(--fg2)}
.rw-v{min-width:0;overflow-wrap:anywhere}
.rw-v.better{background:var(--accent-soft);padding:6px 10px;border-radius:8px}
.loading{margin-top:24px;padding:16px;border:1px solid var(--line);background:var(--surface);border-radius:12px;display:flex;gap:12px;align-items:center}
.tx{margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
.tx summary{cursor:pointer;font-weight:700}
.tx .t{margin-top:10px;overflow-wrap:anywhere;white-space:pre-wrap}
.tx .t b{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--fg2);margin-right:8px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.savenote{font-size:12.5px;color:var(--fg2);margin-top:10px}

/* 紀錄 */
.trends{display:grid;gap:12px;grid-template-columns:1fr;margin-top:20px}
@media (min-width:600px){.trends{grid-template-columns:1fr 1fr}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px}
.tile .k{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;color:var(--fg2)}
.tile .v{display:flex;align-items:baseline;gap:6px}
.tile .v b{font-family:var(--f-mono);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums}
.tile .v span{font-family:var(--f-mono);color:var(--fg2);font-size:13px}
.tile .d{font-size:12.5px;color:var(--fg2)}
.sp-line{fill:none;stroke:var(--accent);stroke-width:1.75;stroke-linejoin:round;stroke-linecap:round}
.sp-dot{fill:var(--fg2)}.sp-end{fill:var(--accent)}
.recs{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:8px}
.rec{display:flex;gap:8px;align-items:stretch}
.rec-main{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.rec-date{font-family:var(--f-mono);font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums}
.rec-body{display:grid;min-width:0}
.rec-title{font-weight:700;overflow-wrap:anywhere}
.rec-sub{font-size:12.5px;color:var(--fg2)}
.rec-score{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;color:var(--accent);white-space:nowrap}
.rec-score.none{color:var(--fg2);font-family:var(--f-sans);font-weight:400;font-size:13px}
.rec-del{background:none;border:1px solid transparent;border-radius:8px;color:var(--fg2);font-size:13px;padding:0 10px;cursor:pointer;white-space:nowrap}
.rec-del.armed{color:var(--bad);border-color:var(--bad)}
.empty{margin-top:22px;padding:22px 18px;border:1px dashed var(--line);border-radius:12px;color:var(--fg2)}
@media (max-width:420px){
  .rec-main{grid-template-columns:1fr auto}
  .rec-date{grid-column:1 / -1}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark">面談練習室</span><span class="sub">Rehearsal Room</span></div>
    <div class="seg tabs" role="tablist" aria-label="頁面">
      <button type="button" role="tab" id="tab-practice" aria-selected="true">練習</button>
      <button type="button" role="tab" id="tab-history" aria-selected="false">紀錄</button>
    </div>
  </header>

  <main>
    <!-- 設定 -->
    <section id="v-setup">
      <h1>今天練什麼？</h1>
      <p class="lead">選面試或談判，填好情境就能開始。對練時 AI 全程入戲，結束後才換成教練，逐項給你回饋。</p>
      <div id="banner" class="banner" hidden>目前的環境無法呼叫 Claude，所以不能對練。請在 Claude 裡開啟這個頁面，不要用下載後的檔案或外部連結。</div>

      <form id="form-setup" autocomplete="off" novalidate>
        <div class="field">
          <span class="lbl" id="lbl-mode">練習類型</span>
          <div class="seg" role="radiogroup" aria-labelledby="lbl-mode">
            <label><input type="radio" name="mode" value="interview" checked><span>面試</span></label>
            <label><input type="radio" name="mode" value="negotiation"><span>談判</span></label>
          </div>
        </div>

        <div id="f-interview" class="fields">
          <div class="row2">
            <div class="field"><label class="lbl" for="iv-role">應徵職位</label><input id="iv-role" type="text" value="行銷企劃專員"></div>
            <div class="field"><label class="lbl" for="iv-industry">公司或產業</label><input id="iv-industry" type="text" value="電商平台，約 200 人"></div>
          </div>
          <div class="field"><label class="lbl" for="iv-level">你的背景</label><input id="iv-level" type="text" value="3 年社群與活動行銷經驗，目前在小型廣告公司"></div>
          <div class="row2">
            <div class="field"><label class="lbl" for="iv-style">面試官風格</label><select id="iv-style"></select><p class="hint-txt" id="iv-style-desc"></p></div>
            <div class="field">
              <span class="lbl" id="lbl-count">主要題數</span>
              <div class="seg" role="radiogroup" aria-labelledby="lbl-count">
                <label><input type="radio" name="count" value="5" checked><span>5 題</span></label>
                <label><input type="radio" name="count" value="8"><span>8 題</span></label>
                <label><input type="radio" name="count" value="12"><span>12 題</span></label>
              </div>
            </div>
          </div>
        </div>

        <div id="f-negotiation" class="fields" hidden>
          <div class="row2">
            <div class="field"><label class="lbl" for="ng-preset">情境</label><select id="ng-preset"></select></div>
            <div class="field"><label class="lbl" for="ng-opp">對方是誰</label><input id="ng-opp" type="text"></div>
          </div>
          <div class="field"><label class="lbl" for="ng-scenario">情境說明</label><textarea id="ng-scenario" rows="3" placeholder="簡單描述現在的狀況、對方開了什麼條件"></textarea></div>
          <div class="row2">
            <div class="field"><label class="lbl" for="ng-goal">你的目標</label><input id="ng-goal" type="text"></div>
            <div class="field"><label class="lbl" for="ng-floor">你的底線 <small>（只有結束後的教練看得到，對方不知道）</small></label><input id="ng-floor" type="text"></div>
          </div>
          <div class="field"><label class="lbl" for="ng-style">對方風格</label><select id="ng-style"></select><p class="hint-txt" id="ng-style-desc"></p></div>
        </div>

        <div class="field">
          <span class="lbl" id="lbl-diff">難度</span>
          <div class="seg" role="radiogroup" aria-labelledby="lbl-diff">
            <label><input type="radio" name="diff" value="easy"><span>簡單</span></label>
            <label><input type="radio" name="diff" value="normal" checked><span>標準</span></label>
            <label><input type="radio" name="diff" value="hard"><span>困難</span></label>
          </div>
          <p class="hint-txt" id="diff-desc"></p>
        </div>

        <p class="note">欄位裡是範例，改成你自己的情況即可。對練內容會送給 Claude 處理，真實的公司名稱或薪資數字可以用代稱代替。</p>
        <p class="err" id="setup-err" hidden></p>
        <div><button type="submit" class="btn primary" id="btn-start">開始練習</button></div>
      </form>
    </section>

    <!-- 對話 -->
    <section id="v-session" hidden>
      <div class="sessionbar">
        <div class="sb-left"><div class="sb-title" id="sb-title"></div><div class="sb-meta" id="sb-meta"></div></div>
        <div class="sb-right"><span class="timer" id="timer">00:00</span><button type="button" class="btn sm" id="btn-finish">結束並看回饋</button></div>
      </div>
      <div class="log" id="log" aria-live="polite"></div>
      <div class="retry" id="retry" hidden></div>
      <div class="composer" id="composer">
        <label class="sr" for="inp">你的回答</label>
        <textarea id="inp" rows="2" placeholder="輸入你的回答…"></textarea>
        <div class="comp-actions">
          <button type="button" class="btn ghost sm" id="btn-hint">場外提示</button>
          <div class="comp-right"><span class="kbd">Ctrl + Enter 送出</span><button type="button" class="btn primary" id="btn-send">送出</button></div>
        </div>
      </div>
    </section>

    <!-- 回饋 -->
    <section id="v-review" hidden></section>

    <!-- 紀錄 -->
    <section id="v-history" hidden></section>
  </main>
</div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  for (const kid of kids.flat(2)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

    '- scores：依上面的順序共 ' + dims.length + ' 項；note 一到兩句，要引用對話中的具體內容。',
    '- strengths：做得好的地方，最多 3 點，每點一句。',
    '- rewrites：最多 3 筆。original 必須出自使用者實際說過的話（可略縮）；problem 一句話；better 是使用者下次可以直接說出口的句子。',
    '- missed：' + (isIv ? '沒有追問補強或本可加分的時機' : '讓步時機、錨定、沒問的問題等錯過的機會') + '，最多 3 點，每點指出在對話的哪個時刻。',

/* ---------- 回覆解析 ---------- */

  const ended = /\[\[END\]\]/.test(raw);
  const qm = raw.match(/\[\[Q:\s*(\d+)\s*\]\]/);
  let text = raw.replace(/\[\[[^\]]*\]\]/g, '').replace(/\[\[?[^\]]*$/, '').trim();
  return { text, ended, q: qm ? Number(qm[1]) : null };
}

async function aiTurn() {
  const run = ++S.run;
  S.busy = true; updateComposer(); hideRetry();
  const bubble = addBubble('assistant', '');
  const ctl = new AbortController(); S.ctl = ctl;
  try {
    const ask = S.sample;
    const res = await ask(buildInput(), {
      signal: ctl.signal, modelTier: 'quick', cache: false,
      onText: ({ text }) => {
        if (run !== S.run) return;
        const keep = nearBottom();
        bubble.textContent = parseReply(text).text || '…';
        if (keep) toBottom();
      }
    });
    if (run !== S.run) return;
    const p = parseReply(res.text);
    const clean = p.text || '（沒有收到內容）';
    bubble.textContent = clean;
    S.turns.push({ role: 'assistant', text: clean, raw: res.text });
    if (S.cfg.mode === 'interview') S.qNow = p.q ? Math.min(p.q, S.qTotal) : Math.max(S.qNow, 1);
    if (p.ended) { S.ended = true; stopTimer(); addEndCard(); }
  } catch (e) {
    if (run !== S.run) return;
    const m = bubble.closest('.msg'); if (m) m.remove();
    if (e && e.code === 'cancelled') showRetry('已停止這次回覆。', true);
    else showRetry(errCopy(e && e.code), !PERMANENT.has(e && e.code));

}

    createdAt: Date.now(), mode: S.cfg.mode, title: titleOf(S.cfg), cfg: S.cfg,
    turns: S.turns.map(({ role, text }) => ({ role, text })),

function persist(rec) {
  const chain = (SAVEQ.get(rec) || Promise.resolve()).then(async () => {
    await storeReady;
    if (!S.col) { SAVED.set(rec, false); return; }
    const { id, ...data } = rec;
    try { await S.col.doc(id).set(data); SAVED.set(rec, true); }
    catch (e) { SAVED.set(rec, false); }
  });
  SAVEQ.set(rec, chain);
  return chain;
}

function normaliseFeedback(raw, mode) {
  const o = raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {};
  const dims = mode === 'interview' ? IV_DIMS : NG_DIMS;
  const list = Array.isArray(o.scores) ? o.scores : [];
  const scores = dims.map((d, i) => {
    const s = list.find((x) => x && String(x.key) === d.key) || list[i] || {};
    let n = Math.round(Number(s.score));
    if (!Number.isFinite(n)) n = 2;
    return { key: d.key, score: Math.min(5, Math.max(1, n)), note: String(s.note == null ? '' : s.note).trim() };
  });
  const strs = (a, max) => (Array.isArray(a) ? a : []).map((x) => String(x == null ? '' : x).trim()).filter(Boolean).slice(0, max);
  const rewrites = (Array.isArray(o.rewrites) ? o.rewrites : []).map((r) => ({
    original: String(r && r.original != null ? r.original : '').trim(),
    problem: String(r && r.problem != null ? r.problem : '').trim(),
    better: String(r && r.better != null ? r.better : '').trim()
  })).filter((r) => r.better).slice(0, 3);
  return {
    summary: String(o.summary == null ? '' : o.summary).trim(),
    result: mode === 'negotiation' ? String(o.result == null ? '' : o.result).trim() : '',
    scores, strengths: strs(o.strengths, 3), rewrites, missed: strs(o.missed, 3),
    nextDrill: String(o.nextDrill == null ? '' : o.nextDrill).trim()

async function requestFeedback(rec) {
  const cur = FB.get(rec); if (cur && cur.loading) return;
  S.sample = S.sample || await samplePromise;
  FB.set(rec, { loading: true });
  if (S.shown === rec) renderReview();
  try {
    const raw = await S.sample.json(feedbackPrompt(rec), { modelTier: 'default', cache: false });
    const fb = normaliseFeedback(raw, rec.mode);
    rec.feedback = fb;
    rec.total = fb.scores.reduce((a, b) => a + b.score, 0);
    rec.max = 25;
    FB.set(rec, {});
    if (S.shown === rec) renderReview();
    await persist(rec);
    if (S.shown === rec) renderReview();
  } catch (e) {

/* ---------- 紀錄 ---------- */
function spark(vals) {
  const W = 120, H = 34, p = 5, n = vals.length, NS = 'http://www.w3.org/2000/svg';
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 4) { lo -= 2; hi += 2; }
  const x = (i) => n === 1 ? W / 2 : p + i * (W - 2 * p) / (n - 1);
  const y = (v) => H - p - ((v - lo) / (hi - lo)) * (H - 2 * p);
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('width', String(W)); svg.setAttribute('height', String(H)); svg.setAttribute('aria-hidden', 'true');
  if (n > 1) {
    const pl = document.createElementNS(NS, 'polyline');
    pl.setAttribute('class', 'sp-line'); pl.setAttribute('points', vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' '));
    svg.append(pl);
  }
  vals.forEach((v, i) => {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', x(i).toFixed(1)); c.setAttribute('cy', y(v).toFixed(1));
    const last = i === n - 1;
    c.setAttribute('r', last ? '3.4' : '1.8'); c.setAttribute('class', last ? 'sp-end' : 'sp-dot');
    svg.append(c);
  });
  return svg;
}
function trendTiles(list) {
  const tiles = ['interview', 'negotiation'].map((m) => {
    const pts = list.filter((r) => r.mode === m && Number.isFinite(r.total)).sort((a, b) => a.createdAt - b.createdAt).slice(-12).map((r) => r.total);
    const label = h('span', { class: 'k', text: modeLabel(m) + '分數' });
    if (!pts.length) return h('div', { class: 'tile' }, label, h('span', { class: 'd', text: '還沒有評分的練習' }));
    const last = pts[pts.length - 1], prev = pts.length > 1 ? pts[pts.length - 2] : null;
    const d = prev == null ? `共 ${pts.length} 次` : (last === prev ? '和前一次持平' : `較前一次 ${last > prev ? '+' : '−'}${Math.abs(last - prev)}`) + ` · 共 ${pts.length} 次`;
    return h('div', { class: 'tile' }, label, h('div', { class: 'v' }, h('b', { text: String(last) }), h('span', { text: '/ 25' })), spark(pts), h('span', { class: 'd', text: d }));
  });
  return h('div', { class: 'trends' }, tiles);
}

/* ---------- 儲存連線 ---------- */
const storeReady = (async () => {
  try {
    const [db, user] = await Promise.all([use('db'), use('user')]);
    if (!db || !user) { S.storeState = 'off'; return; }
    const uid = await user.id();
    if (!uid) { S.storeState = 'off'; return; }
    S.col = db.doc('data/users/' + uid + '/app').collection('sessions');
    S.storeState = 'ready';
    S.col.orderBy('createdAt', 'desc').limit(80).onSnapshot(
      (snap) => { S.sessions = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); S.storeErr = null; renderHistory(); },
      (err) => { S.storeErr = err && err.code ? err.code : 'error'; renderHistory(); }
    );
  } catch (e) {
    S.storeState = 'off';
  } finally {
    renderHistory();
  }
})();

renderHistory();
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
